<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Aayush Jain</title>
  <link rel="icon" type="image/png" href="/assets/favicon-DSqbWA3t.png">
  <link rel="apple-touch-icon" href="/assets/favicon-DSqbWA3t.png">
  <style>
    @font-face {
      font-family: 'Optima';
      src: url('/assets/Optima-Regular-CjVdqR8P.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Optima';
      src: url('/assets/Optima-Medium-VrIRhYy2.ttf') format('truetype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Optima';
      src: url('/assets/Optima-Bold-sLdpseRy.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Optima', 'Optima nova', Candara, 'Segoe UI', sans-serif;
      background: #ffffff;
      color: #111111;
      -webkit-font-smoothing: antialiased;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* ===== TOP NAV (identical to /art) ===== */
    .top-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 30px 34px;
      color: #000000;
      pointer-events: none;
    }

    .brand {
      font-size: clamp(24px, 2.3vw, 36px);
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1;
      pointer-events: auto;
    }

    .nav-links {
      display: flex;
      gap: 26px;
      font-size: clamp(15px, 1.25vw, 20px);
      font-weight: 400;
      letter-spacing: 0.01em;
      pointer-events: auto;
    }
    .nav-links a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }
    .nav-links a:hover { opacity: 0.55; }

    /* ===== GALLERY — two large columns, staggered ===== */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 4vw;
      row-gap: 9vh;
      padding: 12vh 5vw 22vh 5vw;
      align-items: start;
    }

    /* stagger the right column down for the editorial offset */
    .gallery .item:nth-child(even) { margin-top: 14vh; }

    .item {
      opacity: 0;
      transform: translateY(64px);
      transition: opacity 1.15s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 1.15s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform;
    }
    .item.in { opacity: 1; transform: translateY(0); }

    .item img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 768px) {
      .top-nav { padding: 20px 20px; }
      .nav-links { gap: 18px; }
      .gallery {
        grid-template-columns: 1fr;
        row-gap: 6vh;
        padding: 12vh 6vw 20vh 6vw;
      }
      .gallery .item:nth-child(even) { margin-top: 0; }
    }
  </style>
</head>
<body>
  <audio id="bg-audio" src="/song.mp3" loop></audio>
  <script>
    (function() {
      var audio = document.getElementById('bg-audio');
      var saved = localStorage.getItem('audioPlaying');
      var savedTime = parseFloat(localStorage.getItem('audioTime')) || 0;
      if (saved === 'true') {
        audio.currentTime = savedTime;
        audio.play().catch(function() {});
      }
      setInterval(function() {
        if (!audio.paused) localStorage.setItem('audioTime', audio.currentTime);
      }, 500);
      window.addEventListener('beforeunload', function() {
        localStorage.setItem('audioPlaying', !audio.paused);
        localStorage.setItem('audioTime', audio.currentTime);
      });
    })();
  </script>

  <nav class="top-nav">
    <a class="brand" href="/art" style="text-decoration:none;color:inherit;">Aayush Jain</a>
    <div class="nav-links">
      <a href="/artwork">Work</a>
      <a href="mailto:jainaayushmr@gmail.com">Inquiries</a>
    </div>
  </nav>

  <main class="gallery" id="gallery">
    <figure class="item"><img src="/artwork/1.jpg" alt="" loading="eager"></figure>
    <figure class="item"><img src="/artwork/2.jpg" alt="" loading="eager"></figure>
    <figure class="item"><img src="/artwork/3.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/artwork/4.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/artwork/5.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/artwork/6.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/artwork/7.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/artwork/8.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/artwork/9.jpg" alt="" loading="lazy"></figure>
  </main>

  <script>
    (function() {
      const items = document.querySelectorAll('.item');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      items.forEach(i => obs.observe(i));
    })();
  </script>

  <script>
    // Heavy, smooth momentum scroll (desktop only)
    (function() {
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      if (isTouch) return;
      let targetY = window.scrollY;
      let currentY = window.scrollY;
      const ease = 0.11;
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        targetY += e.deltaY;
        targetY = Math.max(0, Math.min(targetY, document.body.scrollHeight - window.innerHeight));
      }, { passive: false });
      function tick() {
        currentY += (targetY - currentY) * ease;
        if (Math.abs(targetY - currentY) < 0.5) currentY = targetY;
        window.scrollTo(0, currentY);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
