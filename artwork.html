<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Aayush Jain</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <style>
    @font-face {
      font-family: 'Optima';
      src: url('fonts/Optima-Regular.ttf') format('truetype');
      font-weight: 400; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Optima';
      src: url('fonts/Optima-Medium.ttf') format('truetype');
      font-weight: 500; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: 'Optima';
      src: url('fonts/Optima-Bold.ttf') format('truetype');
      font-weight: 700; font-style: normal; font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Optima', 'Optima nova', Candara, 'Segoe UI', sans-serif;
      background: #f4efe3;
      color: #2c2a26;
      -webkit-font-smoothing: antialiased;
      max-width: 100vw;
      overflow-x: hidden;
    }

    /* ===== TITLE (Screenshot 2 placement — top left, letter-spaced caps) ===== */
    .page-title {
      position: fixed;
      top: 24px;
      left: 34px;
      z-index: 100;
      font-size: clamp(20px, 1.9vw, 30px);
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #2c2a26;
      mix-blend-mode: multiply;
    }

    /* ===== GALLERY — two large columns, staggered ===== */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 4vw;
      row-gap: 9vh;
      padding: 12vh 5vw 22vh 5vw;
      align-items: start;
    }

    /* stagger the right column down for the editorial offset */
    .gallery .item:nth-child(even) { margin-top: 14vh; }

    .item {
      opacity: 0;
      transform: translateY(64px);
      transition: opacity 1.15s cubic-bezier(0.22, 0.61, 0.36, 1),
                  transform 1.15s cubic-bezier(0.22, 0.61, 0.36, 1);
      will-change: opacity, transform;
    }
    .item.in { opacity: 1; transform: translateY(0); }

    .item img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    @media (max-width: 768px) {
      .page-title { top: 18px; left: 20px; letter-spacing: 0.12em; }
      .gallery {
        grid-template-columns: 1fr;
        row-gap: 6vh;
        padding: 12vh 6vw 20vh 6vw;
      }
      .gallery .item:nth-child(even) { margin-top: 0; }
    }
  </style>
</head>
<body>
  <audio id="bg-audio" src="/song.mp3" loop></audio>
  <script>
    (function() {
      var audio = document.getElementById('bg-audio');
      var saved = localStorage.getItem('audioPlaying');
      var savedTime = parseFloat(localStorage.getItem('audioTime')) || 0;
      if (saved === 'true') {
        audio.currentTime = savedTime;
        audio.play().catch(function() {});
      }
      setInterval(function() {
        if (!audio.paused) localStorage.setItem('audioTime', audio.currentTime);
      }, 500);
      window.addEventListener('beforeunload', function() {
        localStorage.setItem('audioPlaying', !audio.paused);
        localStorage.setItem('audioTime', audio.currentTime);
      });
    })();
  </script>

  <div class="page-title">Photography</div>

  <main class="gallery" id="gallery">
    <figure class="item"><img src="/photography/1.jpg" alt="" loading="eager"></figure>
    <figure class="item"><img src="/photography/2.jpg" alt="" loading="eager"></figure>
    <figure class="item"><img src="/photography/3.jpg" alt="" loading="lazy"></figure>
    <figure class="item"><img src="/photography/4.jpg" alt="" loading="lazy"></figure>
  </main>

  <script>
    (function() {
      const items = document.querySelectorAll('.item');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            obs.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
      items.forEach(i => obs.observe(i));
    })();
  </script>

  <script>
    // Heavy, smooth momentum scroll (desktop only)
    (function() {
      const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      if (isTouch) return;
      let targetY = window.scrollY;
      let currentY = window.scrollY;
      const ease = 0.11;
      window.addEventListener('wheel', (e) => {
        e.preventDefault();
        targetY += e.deltaY;
        targetY = Math.max(0, Math.min(targetY, document.body.scrollHeight - window.innerHeight));
      }, { passive: false });
      function tick() {
        currentY += (targetY - currentY) * ease;
        if (Math.abs(targetY - currentY) < 0.5) currentY = targetY;
        window.scrollTo(0, currentY);
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
