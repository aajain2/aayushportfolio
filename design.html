<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aayush Jain</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aayush Jain — Design">
  <meta property="og:site_name" content="Aayush Jain">
  <meta property="og:url" content="https://fromaayush.com/design">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Aayush Jain — Design">
  <style>
    @font-face {
      font-family: 'Kalice Trial';
      src: url('fonts/KaliceTrial-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Kalice Trial';
      src: url('fonts/KaliceTrial-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== TOKENS ===== */
    :root {
      --br: 16px;
      --br2: 8px;
      --pd: 16px;
      --pd2: 8px;
      --pd3: 4px;

      --color-black: #000;
      --color-white: #e2e6e3;
      --color-blue: #007aff;
      --color-gray10: hsla(135, 7%, 89%, 0.1);
      --color-gray20: hsla(135, 7%, 89%, 0.2);
      --color-gray30: hsla(135, 7%, 89%, 0.3);
      --color-gray50: hsla(135, 7%, 89%, 0.5);
      --color-gray10-hover: hsla(135, 7%, 89%, 0.2);

      --color-card: #1a1a1a;
      --color-toggle: #ffffff1f;
      --color-toggle-hover: #ffffff3d;
      --start2: #343434;
      --end2: #1c1c1c;

      /* Porto Rocha originals, kept for reference:
         --font-text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
         --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; */
      --font-text: 'Kalice Trial', Georgia, serif;
      --font-display: 'Kalice Trial', Georgia, serif;
    }

    html.light {
      --color-black: #fff;
      --color-white: #000;
      --color-gray10: rgba(0, 0, 0, 0.04);
      --color-gray20: rgba(0, 0, 0, 0.2);
      --color-gray30: rgba(0, 0, 0, 0.3);
      --color-gray50: rgba(0, 0, 0, 0.5);
      --color-gray10-hover: rgba(0, 0, 0, 0.08);

      --color-card: #f5f5f5;
      --color-toggle: #00000014;
      --color-toggle-hover: #0000001f;
      --start2: #d9d6d5;
      --end2: #efefef;
    }

    @media (max-width: 768px) {
      :root { --br: 12px; }
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, p, figure { margin: 0; padding: 0; }
    h1, h2, h3 { font-size: inherit; font-weight: inherit; }
    a { color: inherit; text-decoration: none; display: inline-block; position: relative; }
    button { font: inherit; color: inherit; background: none; border: none; padding: 0; }

    html {
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      overflow-y: scroll;
    }

    body {
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 125%;
      background-color: var(--color-black);
      color: var(--color-white);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.5s, color 0.5s;
    }

    .display {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 0.45px;
      line-height: 27px;
    }

    @media (max-width: 768px) {
      body { font-size: 13.5px; letter-spacing: -0.31px; }
      .display { font-size: 16px; letter-spacing: 0.25px; line-height: 130%; }
    }

    /* ===== PROJECT SHELL ===== */
    .wrapper.is-loading { opacity: 0; }
    :root { --project-header-height: 56px; }
    .content { min-width: 0; }
    .wrapper:not(.is-intro) .content { padding: 0 var(--pd2) var(--pd2); }
    .project-header {
      position: sticky;
      top: 0;
      z-index: 30;
      height: var(--project-header-height);
      padding: var(--pd2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--pd2);
      background: var(--color-black);
      transition: background-color 0.5s;
    }
    .wrapper.is-intro .project-header { display: none; }
    .project-header__right { display: flex; align-items: center; gap: var(--pd2); }
    button:focus-visible, a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 5px;
    }
    .hero.media-transition {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      transform-origin: top left;
      margin: 0;
    }
    .wrapper.is-transitioning { pointer-events: none; }
    .wrapper.is-transitioning #hero { visibility: hidden; }
    .wrapper.is-transitioning .page__container > :not(.hero):not(.intro) { opacity: 0; }

    /* ===== BUTTONS ===== */
    .page__button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      font-family: 'Kalice Trial', serif;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.18;
      letter-spacing: -0.005em;
      white-space: nowrap;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .page__button:hover { opacity: 0.5; }
    .page__button:focus { outline: none; }
    .page__button:focus-visible {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (max-width: 383px) {
      :root { --project-header-height: 104px; }
      .project-header { flex-wrap: wrap; }
      .project-header__right { margin-left: auto; }
    }

    /* ===== CONTENT (right column) ===== */
    .page__container {
      padding: 0;
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    /* Set with the transition off, so removing it fades up from nothing
       instead of easing back from whatever it was mid-flight. */
    .page__container.is-entering { opacity: 0; transition: none; }
    @media (prefers-reduced-motion: reduce) {
      .page__container { transition: none; }
    }

    .page__card {
      padding: var(--pd);
      border-radius: var(--br2);
      background-color: var(--color-gray10);
      transition: background-color 0.5s;
    }

    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1496 / 998;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }

    .wrapper:not(.is-intro) #hero {
      height: calc(100svh - var(--project-header-height) - var(--pd2));
      aspect-ratio: auto;
    }

    .hero__slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero__slide:not(.selected) { visibility: hidden; }
    /* Overscanned by 3px a side: some artwork carries its own hairline border
       right at the edge, which reads as a seam against the card. */
    .hero__slide img {
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      margin: -3px;
      object-fit: cover;
      object-position: center center;
      display: block;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-gray30);
      background: radial-gradient(76.17% 129.78% at 23.83% 65.4%, var(--start2) 0, var(--end2) 100%);
      transition: --start2 0.5s, --end2 0.5s;
    }

    .case__study__text {
      display: flex;
      flex-flow: column;
      row-gap: var(--pd2);
      padding: 96px var(--pd);
      align-items: center;
      text-align: center;
    }
    .case__study__text__text { max-width: 720px; }
    /* display:flex above would otherwise beat the UA rule for [hidden] */
    .case__study__text[hidden] { display: none; }
    .case__study__text h2 { color: var(--color-gray50); }
    .case__study__full {
      padding: var(--pd);
      background: var(--color-gray10);
      border-radius: var(--br2);
      text-align: left;
      align-items: flex-start;
    }
    .case__study__text--overview a,
    .case__study__row__text a {
      text-decoration: none;
      transition: color 180ms ease;
    }
    .case__study__text--overview a:hover,
    .case__study__text--overview a:focus-visible,
    .case__study__row__text a:hover,
    .case__study__row__text a:focus-visible { color: var(--color-gray50); }
    @media (prefers-reduced-motion: reduce) {
      .case__study__text--overview a,
      .case__study__row__text a { transition: none; }
    }
    .case__study__full {
      scroll-margin-top: calc(var(--project-header-height) + 8px);
    }
    .case__study__full[hidden] { display: none; }
    .case__study__full h2 { color: var(--color-gray50); margin-bottom: var(--pd2); }
    .case__study__full p + p { margin-top: 1em; }
    .case__study__full-row {
      display: grid;
      grid-template-columns: var(--full-columns, minmax(0, 2fr) minmax(0, 1fr));
      gap: var(--pd2);
      margin-top: var(--pd2);
      align-items: stretch;
    }
    .case__study__full-row[hidden] { display: none; }
    .case__study__full-row--logo-left {
      grid-template-columns: var(--full-columns, minmax(0, 1fr) minmax(0, 2fr));
    }
    .case__study__full-row:not(:has(img)) { grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 769px) {
      .case__study__full-row--half:not(:has(img)) {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    .case__study__full-logo {
      position: relative;
      overflow: hidden;
      padding: 0;
      aspect-ratio: var(--case-image-ratio, 1 / 1);
      align-self: start;
      background: #f5f5f0;
    }
    .case__study__full-logo img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .case__study__full-row--center-image .case__study__full-logo {
      align-self: center;
    }

    .case__study__gallery {
      display: grid;
      gap: var(--pd2);
      grid-template-columns: 1fr 1fr;
      margin-top: var(--pd2);
    }
    .case__study__gallery:empty { display: none; }
    .case__study__gallery__item {
      aspect-ratio: 4 / 3;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }
    .case__study__gallery__item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Flat artwork: shown whole at its own aspect ratio rather than cropped */
    .case__study__sheets {
      display: grid;
      gap: var(--pd2);
      grid-template-columns: 1fr 1fr;
      align-items: start;
      margin-top: var(--pd2);
    }
    .case__study__sheets:empty { display: none; }
    .case__study__sheets__item {
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }
    .case__study__sheets__item img { width: 100%; height: auto; display: block; }

    /* A live page running inside the case study, below the descriptor. The
       card is a full viewport tall so the embedded site's first screen fits
       without anyone having to scroll inside the frame. */
    .case__study__embed {
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      height: calc(100svh - var(--pd2) * 2);
    }
    .case__study__embed:empty { display: none; }
    .case__study__embed iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* One card cutting between images at Porto Rocha's 700ms cadence.
       visibility (not opacity) gives their hard flash rather than a fade. */
    .case__study__flash {
      position: relative;
      width: 100%;
      aspect-ratio: 884 / 461;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      margin-top: var(--pd2);
    }
    .case__study__flash:empty { display: none; }
    .case__study__flash__frame { position: absolute; inset: 0; }
    .case__study__flash__frame:not(.selected) { visibility: hidden; }
    .case__study__flash__frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Tall page shot easing up and down inside a gallery-sized card.
       --scroll-to is measured in JS so any image height works. */
    .case__study__scroller {
      position: relative;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      aspect-ratio: 4 / 3;
      --scroll-to: 0px;
    }
    .case__study__scroller img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: block;
    }
    .case__study__scroller.ready img {
      animation: page-scroll 22s ease-in-out infinite alternate;
    }
    @keyframes page-scroll {
      from { transform: translateY(0); }
      to   { transform: translateY(var(--scroll-to)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .case__study__scroller.ready img { animation: none; }
    }

    .case__study__video {
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      aspect-ratio: 16 / 9;
      margin-top: var(--pd2);
    }
    .case__study__video:empty { display: none; }
    .case__study__video video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Closing row — every card the same height, widths proportional to each
       image's aspect ratio. flex-grow is set from the loaded image in JS, so
       nothing is cropped and the row bottoms line up. */
    /* Free-form rows. Each row is any number of cards across, and a card is
       an image, a stack that flashes between images, or a descriptor set in
       the same type as the main one. Everything below the menu sheets that
       doesn't fit the fixed rows above is built from these. */
    .case__study__rows {
      display: flex;
      flex-flow: column;
      row-gap: var(--pd2);
      margin-top: var(--pd2);
    }
    .case__study__rows:empty { display: none; }

    .case__study__row {
      display: grid;
      gap: var(--pd2);
      grid-template-columns: var(--row-columns, repeat(var(--cols), minmax(0, 1fr)));
      align-items: start;
    }

    .case__study__row__cell {
      position: relative;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      aspect-ratio: var(--ratio, 4 / 3);
    }
    .case__study__row__cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .case__study__row__frame { position: absolute; inset: 0; }
    .case__study__row__frame:not(.selected) { visibility: hidden; }

    /* Descriptor cards, measured off Porto Rocha: a flat 16px buffer on every
       side, text set from the top left, and no fixed ratio — the card takes
       the height its text needs, so nothing is ever cut off or left to
       scroll. It still stretches to the row when there is room to spare. */
    .case__study__row__text {
      display: flex;
      flex-flow: column;
      align-items: flex-start;
      justify-content: flex-start;
      align-self: stretch;
      aspect-ratio: auto;
      row-gap: var(--pd2);
      padding: var(--pd);
      text-align: left;
      overflow: visible;
      background-color: var(--color-gray10);
      transition: background-color 0.5s;
    }
    .case__study__row__text h3 { color: var(--color-gray50); }

    .case__study__closer {
      display: flex;
      flex-wrap: wrap;
      gap: var(--pd2);
      align-items: flex-start;
      background: none;
      padding: 0;
      margin-top: var(--pd2);
    }
    .case__study__closer:empty { display: none; }
    .case__study__closer__item {
      flex: 1 1 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }
    .case__study__closer__item img { width: 100%; height: auto; display: block; }

    .case__study__credits {
      display: flex;
      flex-flow: column;
      row-gap: var(--pd3);
      margin-top: var(--pd2);
    }
    .case__study__credits:empty { display: none; }
    .case__study__credits__row { display: flex; justify-content: space-between; column-gap: 24px; }
    .case__study__credits__row span:first-child { color: var(--color-gray50); }

    /* ===== INTRO — the /design homepage =====
       Arriving with no project named, a visitor gets only this: every project
       named down the left with one lit, and the media cards cross-fading
       beside it. The whole case-study layout, nav column included, stays out
       of the way until they click in. */
    .wrapper.is-intro .page__container > *:not(.intro) { display: none; }
    .wrapper.is-intro .page__container { padding: 0; }

    /* An author `display` beats the UA's [hidden] rule, so say it explicitly. */
    .intro[hidden] { display: none; }

    .intro {
      display: grid;
      grid-template-columns: auto minmax(0, 43.0556vw);
      justify-content: center;
      /* Preserve the 1440px composition as the viewport grows. */
      gap: 12vw;
      align-items: center;
      min-height: 100svh;
      /* Held in from the edges: the pair sits as a block in the middle rather
         than stretching the full width. */
      padding: var(--pd) 8vw;
    }

    .intro__names { display: flex; flex-flow: column; align-items: flex-start; }
    .intro__name { white-space: nowrap; }

    .intro__name {
      font-family: var(--font-display);
      font-size: max(24px, 2.7vw);
      line-height: 1.28;
      letter-spacing: 0.005em;
      text-align: left;
      color: var(--color-gray30);
      cursor: pointer;
      transition: color 0.9s ease;
    }
    .intro__name.selected,
    .intro__name:hover { color: var(--color-white); }

    /* Hover takes priority over the rotating preview's selected name. */
    .intro__names:has(.intro__name:hover) .intro__name {
      color: var(--color-gray30);
      transition: none;
    }
    .intro__names:has(.intro__name:hover) .intro__name:hover {
      color: var(--color-white);
    }

    /* The card itself is a .hero, so it inherits that shape and behaviour
       exactly. Hover is the same tint the nav cards use — an overlay rather
       than opacity on the card, because the card's own opacity would multiply
       against the layers cross-fading inside it and the tint would drift as
       they moved. */
    .intro__media { cursor: pointer; display: block; text-align: inherit; }
    .intro__media::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background-color: var(--color-gray10);
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    .intro__media:hover::after { opacity: 1; }

    /* Fade the decoded incoming image over an opaque, stationary outgoing
       image so the card never reveals its background between projects. */
    .intro__layer {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.1s cubic-bezier(0.19, 1, 0.22, 1);
      will-change: opacity;
    }
    .intro__layer.selected { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      .intro__layer { transition: none; }
    }

    @media (max-width: 768px) {
      .intro {
        grid-template-columns: 1fr;
        row-gap: 32px;
        min-height: 0;
        padding: 40px var(--pd);
      }
      /* Stacked, the card leads and the roster sits under it — the way
         play.studio orders the same pair on a phone. */
      .intro__media { order: 1; aspect-ratio: 3 / 2; }
      .intro__names { order: 2; }
      .intro__name { font-size: clamp(22px, 6vw, 32px); }
    }

    @media (max-width: 768px) {
      .wrapper:not(.is-intro) #hero {
        height: auto;
        aspect-ratio: auto;
      }
      /* The visible image sets the card height, including portrait slides.
         Desktop's fixed frames would otherwise leave letterboxing on phones. */
      .case__study__row__cell:not(.case__study__row__text),
      .case__study__flash,
      .case__study__full-logo { aspect-ratio: auto; }
      .hero__slide.selected,
      .case__study__row__frame.selected,
      .case__study__flash__frame.selected {
        position: relative;
        inset: auto;
        display: block;
      }
      .hero__slide:not(.selected),
      .case__study__row__frame:not(.selected),
      .case__study__flash__frame:not(.selected) { display: none; }
      .hero__slide img {
        width: 100%;
        height: auto;
        margin: 0;
      }
      /* Every homepage preview fills the same rounded card as the photos. */
      .intro__media .intro__layer,
      .intro__media .hero__slide { border-radius: inherit; overflow: hidden; }
      .intro__media .hero__slide { position: absolute; inset: 0; }
      .intro__media .hero__slide img { height: 100%; object-fit: cover; border-radius: inherit; }
      .case__study__text { padding: 56px var(--pd); }
      .case__study__gallery,
      .case__study__sheets,
      .case__study__row,
      .case__study__full-row,
      .case__study__full-row--logo-left { grid-template-columns: minmax(0, 1fr); }
      .case__study__row > *,
      .case__study__full-row > * { min-width: 0; }
      .case__study__closer__item { flex: 1 1 100%; }
      .case__study__gallery__item,
      .case__study__scroller,
      .case__study__video { aspect-ratio: auto; }
      .case__study__gallery__item img,
      .case__study__scroller img,
      .case__study__row__cell img,
      .case__study__flash__frame img,
      .case__study__full-logo img,
      .case__study__video video {
        position: static;
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      .case__study__scroller.ready img { animation: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
    }

    @property --start2 { syntax: '<color>'; inherits: true; initial-value: #343434; }
    @property --end2 { syntax: '<color>'; inherits: true; initial-value: #1c1c1c; }
  </style>
</head>
<body>

  <main class="wrapper is-loading" id="wrapper">

    <header class="project-header">
      <a class="page__button" id="back-btn" href="/design">{back to all projects}</a>
      <div class="project-header__right">
        <a class="page__button" href="/#content">{home}</a>
        <a class="page__button" id="next-btn" href="/design">{next project}</a>
      </div>
    </header>

    <div class="content">
      <div class="page__container" id="page-container">
        <section class="intro" id="intro" hidden>
          <nav class="intro__names" id="intro-names" aria-label="All projects"></nav>
          <button type="button" class="page__card hero intro__media" id="intro-media" aria-label="Open selected project"></button>
        </section>

        <div class="page__card hero" id="hero"></div>
        <div class="case__study__text" id="case-text"></div>
        <div class="page__card case__study__embed" id="case-embed"></div>
        <div class="page__card case__study__flash" id="case-flash"></div>
        <div class="case__study__gallery" id="case-gallery"></div>
        <div class="case__study__sheets" id="case-sheets"></div>
        <div class="page__card case__study__video" id="case-video"></div>
        <div class="case__study__rows" id="case-rows-mid"></div>
        <div class="case__study__closer" id="case-closer"></div>
        <div class="case__study__rows" id="case-rows"></div>
        <div class="case__study__full-row" id="case-full-row" hidden>
          <section class="page__card case__study__full" id="case-full" tabindex="-1" hidden></section>
          <figure class="page__card case__study__full-logo" id="case-full-logo" hidden></figure>
        </div>
        <div class="case__study__credits" id="case-credits"></div>
      </div>
    </div>

  </main>

  <script type="module">
    import D from './design-content.js';

    document.title = D.siteTitle;
    // ===== Theme =====
    // Light is the default; only an explicit choice made here overrides it.
    // The key is versioned because the site used to open dark: anyone still
    // carrying a preference from that era would otherwise stay stuck on dark
    // forever, never seeing the light default. Retiring the old key drops
    // those once, and choices made from now on persist normally.
    const root = document.documentElement;
    const THEME_KEY = 'designTheme.v2';
    localStorage.removeItem('designTheme');

    if (localStorage.getItem(THEME_KEY) === 'dark') root.classList.replace('light', 'dark');

    // ===== Content panel =====
    const heroEl = document.getElementById('hero');
    const textEl = document.getElementById('case-text');
    const embedEl = document.getElementById('case-embed');
    const galleryEl = document.getElementById('case-gallery');
    const sheetsEl = document.getElementById('case-sheets');
    const rowsEl = document.getElementById('case-rows');
    const midRowsEl = document.getElementById('case-rows-mid');
    const flashEl = document.getElementById('case-flash');
    const videoEl = document.getElementById('case-video');
    const closerEl = document.getElementById('case-closer');
    const creditsEl = document.getElementById('case-credits');
    const fullCaseEl = document.getElementById('case-full');
    const fullCaseRowEl = document.getElementById('case-full-row');
    const fullCaseLogoEl = document.getElementById('case-full-logo');

    // Keep the cards side by side. Choose the closest height match possible
    // without stretching the square logo or clipping the text.
    function alignFullCaseCards() {
      fullCaseRowEl.style.removeProperty('--full-columns');
      const width = fullCaseRowEl.clientWidth;
      if (fullCaseRowEl.hidden || fullCaseLogoEl.hidden || width <= 768) return;
      const measure = fullCaseEl.cloneNode(true);
      measure.removeAttribute('id');
      measure.removeAttribute('tabindex');
      Object.assign(measure.style, {
        position: 'absolute', visibility: 'hidden', pointerEvents: 'none',
        left: '-10000px', top: '0', height: 'auto',
      });
      measure.setAttribute('aria-hidden', 'true');
      document.body.appendChild(measure);
      const gap = parseFloat(getComputedStyle(fullCaseRowEl).columnGap);
      const [imageWidth, imageHeight] = (fullCaseLogoEl.dataset.ratio || '1 / 1').split('/').map(Number);
      const imageRatio = imageWidth / imageHeight;
      let bestSide = Math.round(width / 3);
      let bestDifference = Infinity;
      for (let side = Math.ceil(width * 0.25); side <= width * 0.6; side += 4) {
        measure.style.width = (width - gap - side) + 'px';
        const difference = Math.max(0, measure.getBoundingClientRect().height - side / imageRatio);
        if (difference < bestDifference) {
          bestDifference = difference;
          bestSide = side;
        }
        if (difference === 0) {
          break;
        }
      }
      fullCaseRowEl.style.setProperty('--full-columns', fullCaseRowEl.classList.contains('case__study__full-row--logo-left')
        ? `${bestSide}px minmax(0, 1fr)`
        : `minmax(0, 1fr) ${bestSide}px`);
      measure.remove();
    }
    let fullCaseWidth = 0;
    const fullCaseObserver = new ResizeObserver(entries => {
      const width = entries[0].contentRect.width;
      if (width === fullCaseWidth) return;
      fullCaseWidth = width;
      alignFullCaseCards();
    });
    fullCaseObserver.observe(fullCaseRowEl);
    document.fonts.ready.then(alignFullCaseCards);

    let current = -1;
    let slides = [];
    let timer = null;
    let flashTimer = null;
    let scrollerObserver = null;
    let videoObserver = null;
    let rowTimers = [];

    // A project with no media yet still gets three placeholder panels so the
    // layout reads the same once real images land in design-content.js.
    function mediaOf(proj) {
      return proj.media.length ? proj.media : [null, null, null];
    }

    function makeMedia(src, label, defer) {
      if (src) {
        const img = document.createElement('img');
        if (!defer) img.src = src;
        img.alt = '';
        return img;
      }
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = label;
      return ph;
    }

    // Card holding a tall image that eases from its top to its bottom and back.
    // The travel distance is measured rather than assumed, so swapping in an
    // image of any height needs no CSS change.
    function makeScroller(src) {
      const card = document.createElement('figure');
      card.className = 'page__card case__study__scroller';
      const img = document.createElement('img');
      img.alt = '';

      const measure = () => {
        const travel = img.offsetHeight - card.clientHeight;
        if (travel > 0) {
          card.style.setProperty('--scroll-to', '-' + travel + 'px');
          card.classList.add('ready');
        } else {
          card.classList.remove('ready');
        }
      };

      img.addEventListener('load', measure);
      if (scrollerObserver) scrollerObserver.disconnect();
      scrollerObserver = new ResizeObserver(measure);
      scrollerObserver.observe(card);

      img.src = src;
      card.appendChild(img);
      return card;
    }

    // A stack can run to dozens of frames, so only the first is fetched up
    // front and the rest fill in on idle — long before the cycle reaches them.
    function loadFrames(imgs, srcs) {
      if (!srcs.length) return;
      imgs[0].src = srcs[0];
      let n = 1;
      const schedule = () => {
        if (n >= srcs.length) return;
        if (window.requestIdleCallback) requestIdleCallback(next);
        else setTimeout(next, 60);
      };
      const next = () => {
        const img = imgs[n];
        img.addEventListener('load', schedule, { once: true });
        img.addEventListener('error', schedule, { once: true });
        img.src = srcs[n++];
      };
      schedule();
    }

    // Hard cuts at Porto Rocha's 700ms, held still while the tab is hidden.
    function cycle(frames) {
      let i = Math.max(0, frames.findIndex(frame => frame.classList.contains('selected')));
      return setInterval(() => {
        if (document.hidden) return;
        const next = (i + 1) % frames.length;
        const img = frames[next].querySelector('img');
        if (img && (!img.complete || !img.naturalWidth)) return;
        frames[i].classList.remove('selected');
        i = next;
        frames[i].classList.add('selected');
      }, 700);
    }

    // Builds a project's media card. The homepage roster uses this too, so a
    // block there is the same markup, the same deferred loading and the same
    // 700ms cut between frames as the hero inside the case study.
    // A project may set its own ratio when its artwork is shaped very
    // differently from the default (cover would crop it).
    function buildHero(el, proj) {
      if (!el.classList.contains('intro__layer')) el.style.aspectRatio = proj.heroRatio || '';
      el.textContent = '';
      const media = mediaOf(proj);
      const imgs = [];
      const frames = media.map((src, n) => {
        const slide = document.createElement('div');
        slide.className = 'hero__slide' + (n === 0 ? ' selected' : '');
        const m = makeMedia(src, proj.title + ' — ' + (n + 1), true);
        if (m.tagName === 'IMG') imgs.push(m);
        slide.appendChild(m);
        el.appendChild(slide);
        return slide;
      });
      loadFrames(imgs, media.filter(Boolean));
      return frames;
    }

    function renderRows(container, list, proj) {
      container.textContent = '';
      (list || []).forEach(row => {
        const items = Array.isArray(row) ? row : row.items;
        const rowEl = document.createElement('div');
        rowEl.className = 'case__study__row';
        rowEl.style.setProperty('--cols', String(items.length));

        // alignHeights: widths follow each cell's aspect ratio, so every cell
        // in the row resolves to the same height without cropping anything.
        if (row.alignHeights) {
          rowEl.style.setProperty('--row-columns', items.map(it => {
            const [w, h] = (it.ratio || row.ratio || '4 / 3').split('/').map(Number);
            return (w / h) + 'fr';
          }).join(' '));
        }

        items.forEach(item => {
          if (item.fullCaseStudy) {
            rowEl.appendChild(fullCaseEl);
            return;
          }
          const cell = document.createElement(item.text ? 'div' : 'figure');
          cell.className = 'page__card case__study__row__cell';
          const ratio = item.ratio || row.ratio;
          if (ratio) cell.style.setProperty('--ratio', ratio);

          if (item.text) {
            cell.classList.add('case__study__row__text');
            const h3 = document.createElement('h3');
            h3.textContent = item.heading || proj.title;
            const body = document.createElement('p');
            const parts = Array.isArray(item.text) ? item.text : [item.text];
            parts.forEach(part => {
              if (typeof part === 'string') {
                body.append(part);
              } else {
                const link = document.createElement('a');
                link.textContent = part.text;
                link.href = part.url;
                body.append(link);
              }
            });
            cell.append(h3, body);
          } else if (item.flash) {
            const imgs = [];
            const frames = item.flash.map((src, n) => {
              const frame = document.createElement('div');
              frame.className = 'case__study__row__frame' + (n === 0 ? ' selected' : '');
              const img = document.createElement('img');
              img.alt = '';
              imgs.push(img);
              frame.appendChild(img);
              cell.appendChild(frame);
              return frame;
            });
            loadFrames(imgs, item.flash);
            if (frames.length > 1) rowTimers.push(cycle(frames));
          } else {
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = '';
            img.loading = 'lazy';
            if (item.zoom) {
              img.style.transform = `scale(${item.zoom})`;
              img.style.transformOrigin = item.zoomOrigin || 'center';
            }
            cell.appendChild(img);
          }

          rowEl.appendChild(cell);
        });

        container.appendChild(rowEl);
      });
    }

    const panelEl = document.getElementById('page-container');

    // Fade the panel up whenever its contents are swapped, so a project eases
    // in rather than snapping straight to the new images.
    function fadeInPanel() {
      panelEl.classList.add('is-entering');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        panelEl.classList.remove('is-entering');
      }));
    }

    function select(i, scroll) {
      if (i === current) return;
      current = i;
      const proj = D.projects[i];
      const nextProject = D.projects[(i + 1) % D.projects.length];
      nextBtn.href = '/design#' + nextProject.key;
      if (!wrapperEl.classList.contains('is-loading')) fadeInPanel();

      introNames.forEach((el, n) => {
        el.classList.toggle('selected', n === i);
        if (n === i) el.setAttribute('aria-current', 'page');
        else el.removeAttribute('aria-current');
      });

      // Hero slideshow
      slides = buildHero(heroEl, proj);

      // Text block
      textEl.textContent = '';
      const h2 = document.createElement('h2');
      h2.textContent = proj.overview ? 'Overview' : proj.title;
      const body = document.createElement('p');
      body.className = 'case__study__text__text display';
      body.textContent = proj.overview || proj.intro || proj.description;
      textEl.classList.toggle('case__study__text--overview', !!proj.overview);
      if (proj.overview && proj.caseStudy?.length) {
        const link = document.createElement('a');
        link.href = '#' + proj.key + '-case-study';
        link.textContent = 'Read full case study.';
        link.addEventListener('click', event => {
          if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
          event.preventDefault();
          fullCaseEl.focus({ preventScroll: true });
          fullCaseEl.scrollIntoView({ behavior: reducedMotion.matches ? 'instant' : 'smooth', block: 'start' });
        });
        body.append(' ', link);
      }
      textEl.append(h2, body);

      fullCaseEl.textContent = '';
      fullCaseRowEl.prepend(fullCaseEl);
      fullCaseRowEl.classList.toggle('case__study__full-row--logo-left', proj.caseStudyLogoPosition === 'left');
      fullCaseRowEl.classList.toggle('case__study__full-row--half', !!proj.caseStudyHalfWidth);
      fullCaseRowEl.classList.toggle('case__study__full-row--center-image', !!proj.caseStudyImageCentered);
      if (proj.caseStudyLogoPosition === 'left') fullCaseRowEl.prepend(fullCaseLogoEl);
      fullCaseEl.hidden = !proj.caseStudy?.length;
      const inlineCaseStudy = (proj.rows || []).some(row =>
        (Array.isArray(row) ? row : row.items).some(item => item.fullCaseStudy));
      fullCaseRowEl.hidden = fullCaseEl.hidden || inlineCaseStudy;
      fullCaseLogoEl.textContent = '';
      fullCaseLogoEl.hidden = fullCaseEl.hidden || !!proj.hideCaseStudyLogo || !(proj.caseStudyImage || proj.icon);
      fullCaseLogoEl.dataset.ratio = proj.caseStudyImageRatio || '1 / 1';
      fullCaseLogoEl.style.setProperty('--case-image-ratio', fullCaseLogoEl.dataset.ratio);
      if (!fullCaseLogoEl.hidden) {
        const logo = document.createElement('img');
        logo.src = proj.caseStudyImage || proj.icon;
        logo.alt = proj.caseStudyImageAlt || proj.title + ' logo';
        logo.loading = 'lazy';
        fullCaseLogoEl.appendChild(logo);
      }
      fullCaseEl.id = proj.key + '-case-study';
      if (proj.caseStudy?.length) {
        const heading = document.createElement('h2');
        heading.textContent = 'Full case study';
        fullCaseEl.appendChild(heading);
        proj.caseStudy.forEach(paragraph => {
          const p = document.createElement('p');
          p.textContent = paragraph;
          fullCaseEl.appendChild(p);
        });
        if (proj.caseStudyLink) {
          const p = document.createElement('p');
          const link = document.createElement('a');
          link.textContent = proj.caseStudyLink.text;
          link.href = proj.caseStudyLink.url;
          p.appendChild(link);
          fullCaseEl.appendChild(p);
        }
      }
      alignFullCaseCards();

      // hideText drops the descriptor entirely, for a project that is only
      // pictures. textAtEnd moves it below the rows instead, for one that
      // wants the pictures to speak first. The container is the same element
      // either way, so nothing else has to know.
      const container = textEl.parentNode;
      textEl.hidden = !!proj.hideText;
      if (proj.textAtEnd) container.insertBefore(textEl, creditsEl);
      else container.insertBefore(textEl, embedEl);

      // Live embed — the published page itself, sitting under the descriptor
      embedEl.textContent = '';
      if (proj.embed) {
        const frame = document.createElement('iframe');
        frame.src = proj.embed;
        frame.title = proj.title;
        frame.loading = 'lazy';
        frame.allow = 'clipboard-write; fullscreen';
        embedEl.appendChild(frame);
      }

      // Gallery — the scroller leads, then the tiles. `gallery` overrides the
      // hero `media` when the two should differ.
      galleryEl.textContent = '';
      if (proj.scroller) galleryEl.appendChild(makeScroller(proj.scroller));
      const tiles = proj.gallery || (proj.scroller ? [] : mediaOf(proj));
      tiles.forEach((src, n) => {
        const item = document.createElement('figure');
        item.className = 'page__card case__study__gallery__item';
        item.appendChild(makeMedia(src, proj.title + ' — ' + (n + 1)));
        galleryEl.appendChild(item);
      });

      // Printed pieces — never cropped, so no placeholder stand-in
      sheetsEl.textContent = '';
      (proj.sheets || []).forEach(src => {
        const item = document.createElement('figure');
        item.className = 'page__card case__study__sheets__item';
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.loading = 'lazy';
        item.appendChild(img);
        sheetsEl.appendChild(item);
      });

      // Flashing card — hard cuts at Porto Rocha's 700ms, paused in a hidden tab
      clearInterval(flashTimer);
      flashEl.textContent = '';
      const flashSrcs = proj.flash || [];
      const flashImgs = [];
      const frames = flashSrcs.map((src, n) => {
        const frame = document.createElement('div');
        frame.className = 'case__study__flash__frame' + (n === 0 ? ' selected' : '');
        const img = document.createElement('img');
        img.alt = '';
        flashImgs.push(img);
        frame.appendChild(img);
        flashEl.appendChild(frame);
        return frame;
      });
      loadFrames(flashImgs, flashSrcs);
      if (frames.length > 1) flashTimer = cycle(frames);

      // Free-form rows — images, flashing stacks and descriptors, any number
      // of cards across. `midRows` sits between the video and the closer,
      // `rows` below the closer.
      rowTimers.forEach(clearInterval);
      rowTimers = [];
      renderRows(midRowsEl, proj.midRows, proj);
      renderRows(rowsEl, proj.rows, proj);

      // Video — silent, looping, and only fetched once it scrolls into view
      if (videoObserver) { videoObserver.disconnect(); videoObserver = null; }
      videoEl.textContent = '';
      if (proj.video) {
        const video = document.createElement('video');
        video.src = proj.video;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = 'metadata';
        videoEl.appendChild(video);
        // Start once it is first seen — so 23MB is not fetched sight unseen —
        // then let it loop constantly rather than pausing when scrolled past.
        videoObserver = new IntersectionObserver((entries, obs) => {
          if (entries.some(e => e.isIntersecting)) {
            video.play().catch(() => {});
            obs.disconnect();
            videoObserver = null;
          }
        }, { threshold: 0.25 });
        videoObserver.observe(videoEl);
      }

      // Closing row — same height for every card, so width tracks aspect ratio
      closerEl.textContent = '';
      (proj.closer ? [].concat(proj.closer) : []).forEach(src => {
        const item = document.createElement('figure');
        item.className = 'page__card case__study__closer__item';
        const img = document.createElement('img');
        img.alt = '';
        const fit = () => {
          if (img.naturalWidth && img.naturalHeight) {
            item.style.flexGrow = img.naturalWidth / img.naturalHeight;
          }
        };
        img.addEventListener('load', fit);
        img.src = src;
        fit(); // already cached
        item.appendChild(img);
        closerEl.appendChild(item);
      });

      // Credits
      creditsEl.textContent = '';
      (proj.credits || []).forEach(row => {
        const line = document.createElement('div');
        line.className = 'case__study__credits__row';
        const role = document.createElement('span');
        role.textContent = row.role;
        const name = document.createElement('span');
        name.textContent = row.name;
        line.append(role, name);
        creditsEl.appendChild(line);
      });

      restart();

      if (scroll) window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function restart() {
      clearInterval(timer);
      if (slides.length > 1) timer = cycle(slides);
    }

    // ===== Intro =====
    // The homepage: names on the left, every project's media cross-fading on
    // the right, holding on each in turn. Clicking either way in hands over to
    // the case-study layout.
    const INTRO_HOLD = 2600;
    const INTRO_FADE = 1100;   // must match the .intro__layer transition

    const wrapperEl = document.getElementById('wrapper');
    const introEl = document.getElementById('intro');
    const introNamesEl = document.getElementById('intro-names');
    const introMediaEl = document.getElementById('intro-media');
    let introAt = 0;
    let introTimer = null;
    let hoveredIntro = -1;

    const introNames = D.projects.map((proj, i) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'intro__name';
      el.textContent = proj.listTitle || proj.title;
      el.addEventListener('click', event => enterProject(i, true, event.detail === 0));
      el.addEventListener('pointerenter', event => {
        if (event.pointerType === 'touch' || transitioning || !wrapperEl.classList.contains('is-intro')) return;
        hoveredIntro = i;
        clearInterval(introTimer);
        introTimer = null;
        if (introAt !== i) paintIntro(i);
      });
      el.addEventListener('pointerleave', () => {
        if (hoveredIntro !== i) return;
        hoveredIntro = -1;
        if (!transitioning && wrapperEl.classList.contains('is-intro')) scheduleIntroRotation();
      });
      introNamesEl.appendChild(el);
      return el;
    });

    // Two layers, so a project fades in over the one it replaces instead of
    // the card blanking between them. Each keeps its own flash interval.
    const introLayers = [0, 1].map(() => {
      const el = document.createElement('div');
      el.className = 'intro__layer';
      introMediaEl.appendChild(el);
      return el;
    });
    const introFlash = [null, null];
    let introFront = 0;
    let introRetire = null;
    let introRequest = 0;

    function settleIntroFade() {
      clearTimeout(introRetire);
      introLayers.forEach((el, n) => {
        el.style.transition = 'none';
        el.style.zIndex = '0';
        el.classList.toggle('selected', n === introFront);
      });
      void introMediaEl.offsetWidth;
      introLayers.forEach(el => { el.style.transition = ''; });
    }

    function restoreFrame(frames, project, src) {
      const index = mediaOf(project).indexOf(src);
      if (index < 0) return;
      frames.forEach((slide, n) => {
        slide.classList.toggle('selected', n === index);
        if (n === index) slide.querySelector('img').src = src;
      });
    }

    function paintIntro(i, immediate, frameSrc) {
      const request = ++introRequest;
      const prepared = document.createElement('div');
      const frames = buildHero(prepared, D.projects[i]);
      restoreFrame(frames, D.projects[i], frameSrc);

      const show = () => {
        // A newer hover or navigation supersedes any image still loading.
        if (request !== introRequest) return;
        introFlash.forEach(clearInterval);
        introFlash.fill(null);
        settleIntroFade();

        const front = introFront;
        const back = immediate ? front : 1 - front;
        introLayers[back].replaceChildren(...prepared.childNodes);
        introAt = i;
        introMediaEl.setAttribute('aria-label', 'Open ' + D.projects[i].title);
        introNames.forEach((el, n) => el.classList.toggle('selected', n === i));

        if (immediate) {
          if (frames.length > 1) introFlash[back] = cycle(frames);
          return;
        }

        introLayers[back].style.zIndex = '1';
        void introLayers[back].offsetWidth;
        introLayers[back].classList.add('selected');
        introFront = back;
        introRetire = setTimeout(() => {
          settleIntroFade();
          introLayers[front].textContent = '';
          if (frames.length > 1) introFlash[back] = cycle(frames);
        }, reducedMotion.matches ? 0 : INTRO_FADE);
      };

      const firstImage = prepared.querySelector('.hero__slide.selected img');
      if (immediate || !firstImage) show();
      else firstImage.decode().then(show).catch(() => {});
    }

    const backBtn = document.getElementById('back-btn');
    const nextBtn = document.getElementById('next-btn');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let transitioning = false;
    let pendingLocation = false;

    function stopIntro() {
      ++introRequest;
      clearInterval(introTimer);
      introFlash.forEach(clearInterval);
      settleIntroFade();
      introTimer = null;
    }

    // A fixed copy carries the actual preview frame between the two layouts.
    // Resize only the fixed copy so object-fit keeps the artwork proportional
    // and crops it from the center as the expanded hero reaches its height cap.
    async function morphMedia(source, target, changeLayout, after) {
      if (transitioning) return;
      transitioning = true;
      const from = source.getBoundingClientRect();
      const copy = source.cloneNode(true);
      copy.removeAttribute('id');
      copy.removeAttribute('aria-label');
      copy.setAttribute('aria-hidden', 'true');
      copy.classList.add('media-transition');
      Object.assign(copy.style, {
        left: from.left + 'px', top: from.top + 'px',
        width: from.width + 'px', height: from.height + 'px',
      });
      changeLayout();
      const to = target.getBoundingClientRect();
      if (!reducedMotion.matches && from.width && to.width) {
        document.body.appendChild(copy);
        target.style.visibility = 'hidden';
        wrapperEl.classList.add('is-transitioning');
        const timing = { duration: 950, easing: 'cubic-bezier(0.22, 1, 0.36, 1)' };
        const mediaAnimation = copy.animate([
          { transform: 'translate(0, 0)', width: from.width + 'px', height: from.height + 'px' },
          { transform: `translate(${to.left - from.left}px, ${to.top - from.top}px)`, width: to.width + 'px', height: to.height + 'px' },
        ], { ...timing, fill: 'forwards' });
        if (wrapperEl.classList.contains('is-intro')) {
          introNamesEl.animate([{ opacity: 0 }, { opacity: 1 }], timing);
        }
        await Promise.allSettled([mediaAnimation.finished]);
        copy.remove();
        target.style.visibility = '';
        wrapperEl.classList.remove('is-transitioning');
        if (!wrapperEl.classList.contains('is-intro')) {
          [...panelEl.children].filter(el => el !== heroEl && el !== introEl).forEach(el => {
            el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 350, easing: 'ease-out' });
          });
        }
      }
      transitioning = false;
      after?.();
      if (pendingLocation) {
        pendingLocation = false;
        followLocation();
      }
    }

    function enterProject(i, updateHistory = true, focusNavigation = false) {
      if (transitioning) return;
      if (!wrapperEl.classList.contains('is-intro')) {
        select(i, true);
        if (updateHistory && location.hash !== '#' + D.projects[i].key)
          history.pushState(null, '', '#' + D.projects[i].key);
        return;
      }
      stopIntro();
      // A click on a different name should expand that project's artwork.
      if (introAt !== i) paintIntro(i, true);
      stopIntro();
      const visibleFrame = introLayers[introFront].querySelector('.hero__slide.selected img');
      const visibleSrc = visibleFrame?.getAttribute('src');
      morphMedia(introMediaEl, heroEl, () => {
        introEl.hidden = true;
        wrapperEl.classList.remove('is-intro');
        select(i, false);
        clearInterval(timer);
        // Keep the slideshow on the same frame throughout the expansion.
        restoreFrame(slides, D.projects[i], visibleSrc);
        window.scrollTo({ top: 0, behavior: 'instant' });
        if (updateHistory) history.pushState(null, '', '#' + D.projects[i].key);
      }, () => {
        restart();
        if (focusNavigation) backBtn.focus({ preventScroll: true });
      });
    }

    introMediaEl.addEventListener('click', event => enterProject(introAt, true, event.detail === 0));

    function startIntro(i = 0, frameSrc, run = true) {
      stopIntro();
      wrapperEl.classList.add('is-intro');
      introEl.hidden = false;
      introNames.forEach(el => el.removeAttribute('aria-current'));
      introLayers.forEach(el => el.classList.remove('selected'));
      paintIntro(i, true, frameSrc);
      stopIntro();
      if (run) resumeIntro();
    }

    function resumeIntro() {
      stopIntro();
      const frames = [...introLayers[introFront].querySelectorAll('.hero__slide')];
      if (frames.length > 1) introFlash[introFront] = cycle(frames);
      scheduleIntroRotation();
    }

    function scheduleIntroRotation() {
      clearInterval(introTimer);
      introTimer = null;
      if (hoveredIntro >= 0) return;
      if (!reducedMotion.matches) introTimer = setInterval(() => {
        if (!document.hidden) paintIntro((introAt + 1) % D.projects.length);
      }, INTRO_HOLD);
    }

    function backToProjects(updateHistory = true, focusNavigation = false) {
      if (transitioning || wrapperEl.classList.contains('is-intro')) return;
      const selected = current;
      const visibleSrc = heroEl.querySelector('.hero__slide.selected img')?.getAttribute('src');
      // Bring a scrolled case study back to its hero before the return motion.
      window.scrollTo({ top: 0, behavior: 'instant' });
      morphMedia(heroEl, introMediaEl, () => {
        clearInterval(timer);
        clearInterval(flashTimer);
        rowTimers.forEach(clearInterval);
        videoEl.querySelector('video')?.pause();
        if (videoObserver) videoObserver.disconnect();
        embedEl.textContent = '';
        current = -1;
        startIntro(selected, visibleSrc, false);
        window.scrollTo({ top: 0, behavior: 'instant' });
        if (updateHistory) history.pushState(null, '', location.pathname + location.search);
      }, () => {
        resumeIntro();
        if (focusNavigation) introNames[selected].focus({ preventScroll: true });
      });
    }

    nextBtn.addEventListener('click', event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      enterProject((current + 1) % D.projects.length);
    });

    backBtn.addEventListener('click', event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      backToProjects(true, event.detail === 0);
    });

    function followLocation() {
      if (transitioning) { pendingLocation = true; return; }
      const i = D.projects.findIndex(p => '#' + p.key === location.hash.replace(/-case-study$/, ''));
      if (i >= 0) {
        enterProject(i, false);
        if (location.hash.endsWith('-case-study')) {
          if (transitioning) pendingLocation = true;
          else requestAnimationFrame(() => fullCaseEl.scrollIntoView({ block: 'start' }));
        }
      }
      else backToProjects(false);
    }
    window.addEventListener('popstate', followLocation);
    window.addEventListener('hashchange', followLocation);

    const fromHash = D.projects.findIndex(p => '#' + p.key === location.hash.replace(/-case-study$/, ''));
    if (fromHash >= 0) {
      select(fromHash, false);
    } else startIntro();

    // Reveal once the initial layout is ready, without replaying on project changes.
    const firstImage = (fromHash >= 0 ? heroEl : introLayers[introFront]).querySelector('img');
    const arrivalReady = Promise.all([
      document.fonts.ready,
      firstImage ? firstImage.decode().catch(() => {}) : Promise.resolve(),
    ]);
    Promise.race([
      arrivalReady,
      new Promise(resolve => setTimeout(resolve, 350)),
    ]).then(() => {
      wrapperEl.classList.remove('is-loading');
      if (fromHash >= 0 && location.hash.endsWith('-case-study')) {
        fullCaseEl.scrollIntoView({ block: 'start' });
      }
      if (!reducedMotion.matches) {
        wrapperEl.animate([{ opacity: 0 }, { opacity: 1 }], {
          duration: 350,
          easing: 'ease-out',
        });
      }
    });

  </script>

</body>
</html>
