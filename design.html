<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Aayush Jain</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Aayush Jain — Design">
  <meta property="og:site_name" content="Aayush Jain">
  <meta property="og:url" content="https://fromaayush.com/design">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Aayush Jain — Design">
  <style>
    @font-face {
      font-family: 'Kalice Trial';
      src: url('fonts/KaliceTrial-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Kalice Trial';
      src: url('fonts/KaliceTrial-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== TOKENS ===== */
    :root {
      --br: 16px;
      --br2: 8px;
      --pd: 16px;
      --pd2: 8px;
      --pd3: 4px;

      --color-black: #000;
      --color-white: #e2e6e3;
      --color-blue: #007aff;
      --color-gray10: hsla(135, 7%, 89%, 0.1);
      --color-gray20: hsla(135, 7%, 89%, 0.2);
      --color-gray30: hsla(135, 7%, 89%, 0.3);
      --color-gray50: hsla(135, 7%, 89%, 0.5);
      --color-gray10-hover: hsla(135, 7%, 89%, 0.2);

      --color-card: #1a1a1a;
      --color-toggle: #ffffff1f;
      --color-toggle-hover: #ffffff3d;
      --start2: #343434;
      --end2: #1c1c1c;

      /* Porto Rocha originals, kept for reference:
         --font-text: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
         --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; */
      --font-text: 'Kalice Trial', Georgia, serif;
      --font-display: 'Kalice Trial', Georgia, serif;
    }

    html.light {
      --color-black: #fff;
      --color-white: #000;
      --color-gray10: rgba(0, 0, 0, 0.04);
      --color-gray20: rgba(0, 0, 0, 0.2);
      --color-gray30: rgba(0, 0, 0, 0.3);
      --color-gray50: rgba(0, 0, 0, 0.5);
      --color-gray10-hover: rgba(0, 0, 0, 0.08);

      --color-card: #f5f5f5;
      --color-toggle: #00000014;
      --color-toggle-hover: #0000001f;
      --start2: #d9d6d5;
      --end2: #efefef;
    }

    @media (max-width: 768px) {
      :root { --br: 12px; }
    }

    /* ===== RESET ===== */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, h3, p, figure { margin: 0; padding: 0; }
    h1, h2, h3 { font-size: inherit; font-weight: inherit; }
    a { color: inherit; text-decoration: none; display: inline-block; position: relative; }
    button { font: inherit; color: inherit; background: none; border: none; padding: 0; }

    html {
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      overflow-y: scroll;
    }

    body {
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 125%;
      background-color: var(--color-black);
      color: var(--color-white);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.5s, color 0.5s;
    }

    .display {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 400;
      letter-spacing: 0.45px;
      line-height: 27px;
    }

    @media (max-width: 768px) {
      body { font-size: 13.5px; letter-spacing: -0.31px; }
      .display { font-size: 16px; letter-spacing: 0.25px; line-height: 130%; }
      .nav__clock { font-size: 23px; letter-spacing: 0.45px; line-height: 27px; }
    }

    /* ===== SHELL ===== */
    .wrapper { display: flex; }
    .content { flex: auto; min-width: 0; }

    /* ===== NAV (left column) ===== */
    .nav {
      flex-shrink: 0;
      position: sticky;
      top: 0;
      max-height: 100svh;
      overflow-y: auto;
      padding: var(--pd2);
      padding-right: 0;
      scrollbar-width: none;
    }
    .nav::-webkit-scrollbar { display: none; }

    .nav__inner {
      width: clamp(368px, calc(346.667px + 0.0277778 * 100vw), 400px);
    }

    .nav__top__inner { display: flex; flex-flow: column; }

    .nav__top__top {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: space-between;
    }

    .nav__top__top__right { display: flex; position: relative; }

    .nav__top__middle {
      display: flex;
      flex: auto;
      flex-flow: column;
      align-items: center;
      row-gap: 48px;
      padding: 74px 0;
    }

    .nav__wordmark {
      cursor: pointer;
      margin: -10px;
      padding: 10px;
      font-family: var(--font-display);
      font-size: 27px;
      line-height: 1;
      letter-spacing: 0.2px;
      white-space: nowrap;
      transition: color 0.5s;
    }

    .nav__clock {
      cursor: default;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ===== BUTTONS ===== */
    .page__button {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 16px;
      column-gap: var(--pd2);
      border-radius: 40px;
      background-color: var(--color-gray10);
      cursor: pointer;
      transition: background-color 0.5s;
    }
    .page__button:hover { background-color: var(--color-gray10-hover); }

    .page__button__icon__back {
      flex-shrink: 0;
      width: 7px;
      height: 7px;
      border: 1.5px solid var(--color-white);
      border-bottom: none;
      border-right: none;
      transform: rotate(-45deg);
      transition: border-color 0.5s;
    }

    /* Light-mode toggle */
    .nav__light__mode {
      width: 62px;
      height: 38px;
      padding: 3px;
      border-radius: 38px;
      background-color: var(--color-toggle);
      cursor: pointer;
      transition: background-color 0.5s, transform 0.5s;
      will-change: transform;
    }
    .nav__light__mode:hover { background-color: var(--color-toggle-hover); }
    .nav__top__top__right.has-gallery .nav__light__mode { transform: translateX(-42px); }

    .nav__light__mode__knob {
      aspect-ratio: 1;
      height: 100%;
      border-radius: 50%;
      background-color: var(--color-gray10);
      transition: background-color 0.5s, transform 0.5s;
    }
    html.dark .nav__light__mode__knob { transform: translateX(23px); }
    html.light .nav__light__mode__knob { background-color: var(--color-black); }

    /* Gallery play/pause */
    .nav__gallery__mode {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--color-toggle);
      cursor: pointer;
      transition: background-color 0.5s, opacity 0.3s 0.25s;
      will-change: opacity;
    }
    .nav__gallery__mode:hover { background-color: var(--color-toggle-hover); }
    .nav__top__top__right:not(.has-gallery) .nav__gallery__mode {
      opacity: 0;
      pointer-events: none;
      transition: background-color 0.5s, opacity 0.2s;
    }

    .nav__gallery__mode__play {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 4.5px 0 4.5px 7.5px;
      border-color: transparent transparent transparent var(--color-white);
      transform: translateX(1px);
      transition: border-color 0.5s;
    }
    .nav__gallery__mode.playing .nav__gallery__mode__play {
      width: 7px;
      height: 9px;
      border: none;
      transform: none;
      background-color: var(--color-white);
      -webkit-mask: linear-gradient(#000 0 0) left / 2.5px 100% no-repeat,
                    linear-gradient(#000 0 0) right / 2.5px 100% no-repeat;
              mask: linear-gradient(#000 0 0) left / 2.5px 100% no-repeat,
                    linear-gradient(#000 0 0) right / 2.5px 100% no-repeat;
      transition: background-color 0.5s;
    }

    /* ===== CARD STACK ===== */
    .nav__cards {
      display: flex;
      flex-flow: column;
      row-gap: 8px;
      /* Trailing space so the last card can clear the fold zone. The fold
         starts half a card early, so this must exceed h/2 (~49px) minus the
         nav's own bottom padding, or the stack never flattens at the end. */
      padding-bottom: 60px;
    }

    .nav__card { pointer-events: none; }
    /* Cards past the foot of the nav fold into a stack, so it reads as
       "there is more below" rather than just clipping. */
    .nav__card__inner { transform-origin: 50% 100%; will-change: transform, opacity; }

    .nav__card__inner {
      position: relative;
      display: flex;
      min-height: 98px;
      padding: 16px;
      column-gap: 12px;
      border-radius: 10px;
      overflow: hidden;
      pointer-events: auto;
      background-color: var(--color-card);
      transition: background-color 0.5s;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }

    .nav__card__inner::after {
      content: '';
      position: absolute;
      inset: 0;
      background-color: var(--color-gray10);
      opacity: 0;
      transition: opacity 0.5s;
      pointer-events: none;
    }
    .nav__card__inner:hover::after { opacity: 1; }
    .nav__card.selected .nav__card__inner::after { opacity: 1; }

    .nav__card__img {
      position: relative;
      flex-shrink: 0;
      width: 65px;
      height: 65px;
      border-radius: 10px;
      overflow: hidden;
      background-color: var(--color-gray10);
    }
    .nav__card__img img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .nav__card__bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 0.45px;
      color: var(--color-gray50);
      background: radial-gradient(76.17% 129.78% at 23.83% 65.4%, var(--start2) 0, var(--end2) 100%);
      transition: --start2 0.5s, --end2 0.5s;
    }

    .nav__card__info { position: relative; min-width: 0; }
    .nav__card__info h2 { color: var(--color-white); }
    .nav__card__info p { color: var(--color-gray50); }

    /* About card */
    .nav__card__about .nav__card__inner {
      cursor: default;
      align-items: flex-start;
      height: auto;
    }
    .nav__card__about .nav__card__inner::after { display: none; }
    .nav__card__about .nav__card__info h2 { margin-bottom: 2px; }

    .nav__card__about__link {
      color: var(--color-gray50);
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .nav__card__about__link:hover { color: var(--color-white); }


    /* ===== CONTENT (right column) ===== */
    .page__container {
      padding: var(--pd2);
      opacity: 1;
      transition: opacity 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    /* Set with the transition off, so removing it fades up from nothing
       instead of easing back from whatever it was mid-flight. */
    .page__container.is-entering { opacity: 0; transition: none; }
    @media (prefers-reduced-motion: reduce) {
      .page__container { transition: none; }
    }

    .page__card {
      padding: var(--pd);
      border-radius: var(--br2);
      background-color: var(--color-gray10);
      transition: background-color 0.5s;
    }

    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 1496 / 998;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }

    .hero__slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero__slide:not(.selected) { visibility: hidden; }
    /* Overscanned by 3px a side: some artwork carries its own hairline border
       right at the edge, which reads as a seam against the card. */
    .hero__slide img {
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      margin: -3px;
      object-fit: cover;
      display: block;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-gray30);
      background: radial-gradient(76.17% 129.78% at 23.83% 65.4%, var(--start2) 0, var(--end2) 100%);
      transition: --start2 0.5s, --end2 0.5s;
    }

    .case__study__text {
      display: flex;
      flex-flow: column;
      row-gap: var(--pd2);
      padding: 96px var(--pd);
      align-items: center;
      text-align: center;
    }
    .case__study__text__text { max-width: 720px; }
    /* display:flex above would otherwise beat the UA rule for [hidden] */
    .case__study__text[hidden] { display: none; }
    .case__study__text h2 { color: var(--color-gray50); }

    .case__study__gallery {
      display: grid;
      gap: var(--pd2);
      grid-template-columns: 1fr 1fr;
      margin-top: var(--pd2);
    }
    .case__study__gallery:empty { display: none; }
    .case__study__gallery__item {
      aspect-ratio: 4 / 3;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }
    .case__study__gallery__item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Flat artwork: shown whole at its own aspect ratio rather than cropped */
    .case__study__sheets {
      display: grid;
      gap: var(--pd2);
      grid-template-columns: 1fr 1fr;
      align-items: start;
      margin-top: var(--pd2);
    }
    .case__study__sheets:empty { display: none; }
    .case__study__sheets__item {
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }
    .case__study__sheets__item img { width: 100%; height: auto; display: block; }

    /* A live page running inside the case study, below the descriptor. The
       card is a full viewport tall so the embedded site's first screen fits
       without anyone having to scroll inside the frame. */
    .case__study__embed {
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      height: calc(100svh - var(--pd2) * 2);
    }
    .case__study__embed:empty { display: none; }
    .case__study__embed iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* One card cutting between images at Porto Rocha's 700ms cadence.
       visibility (not opacity) gives their hard flash rather than a fade. */
    .case__study__flash {
      position: relative;
      width: 100%;
      aspect-ratio: 884 / 461;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      margin-top: var(--pd2);
    }
    .case__study__flash:empty { display: none; }
    .case__study__flash__frame { position: absolute; inset: 0; }
    .case__study__flash__frame:not(.selected) { visibility: hidden; }
    .case__study__flash__frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Tall page shot easing up and down inside a gallery-sized card.
       --scroll-to is measured in JS so any image height works. */
    .case__study__scroller {
      position: relative;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      aspect-ratio: 4 / 3;
      --scroll-to: 0px;
    }
    .case__study__scroller img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto;
      display: block;
    }
    .case__study__scroller.ready img {
      animation: page-scroll 22s ease-in-out infinite alternate;
    }
    @keyframes page-scroll {
      from { transform: translateY(0); }
      to   { transform: translateY(var(--scroll-to)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .case__study__scroller.ready img { animation: none; }
    }

    .case__study__video {
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      aspect-ratio: 16 / 9;
      margin-top: var(--pd2);
    }
    .case__study__video:empty { display: none; }
    .case__study__video video { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Closing row — every card the same height, widths proportional to each
       image's aspect ratio. flex-grow is set from the loaded image in JS, so
       nothing is cropped and the row bottoms line up. */
    /* Free-form rows. Each row is any number of cards across, and a card is
       an image, a stack that flashes between images, or a descriptor set in
       the same type as the main one. Everything below the menu sheets that
       doesn't fit the fixed rows above is built from these. */
    .case__study__rows {
      display: flex;
      flex-flow: column;
      row-gap: var(--pd2);
      margin-top: var(--pd2);
    }
    .case__study__rows:empty { display: none; }

    .case__study__row {
      display: grid;
      gap: var(--pd2);
      grid-template-columns: repeat(var(--cols), 1fr);
      align-items: start;
    }

    .case__study__row__cell {
      position: relative;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
      aspect-ratio: var(--ratio, 4 / 3);
    }
    .case__study__row__cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .case__study__row__frame { position: absolute; inset: 0; }
    .case__study__row__frame:not(.selected) { visibility: hidden; }

    .case__study__row__text {
      display: flex;
      flex-flow: column;
      align-items: center;
      justify-content: center;
      row-gap: var(--pd2);
      padding: var(--pd) clamp(var(--pd), 8%, 72px);
      text-align: center;
      background-color: var(--color-gray10);
      transition: background-color 0.5s;
    }
    .case__study__row__text h3 { color: var(--color-gray50); }

    .case__study__closer {
      display: flex;
      flex-wrap: wrap;
      gap: var(--pd2);
      align-items: flex-start;
      background: none;
      padding: 0;
      margin-top: var(--pd2);
    }
    .case__study__closer:empty { display: none; }
    .case__study__closer__item {
      flex: 1 1 0;
      min-width: 0;
      padding: 0;
      overflow: hidden;
      border-radius: var(--br2);
    }
    .case__study__closer__item img { width: 100%; height: auto; display: block; }

    .case__study__credits {
      display: flex;
      flex-flow: column;
      row-gap: var(--pd3);
      margin-top: var(--pd2);
    }
    .case__study__credits:empty { display: none; }
    .case__study__credits__row { display: flex; justify-content: space-between; column-gap: 24px; }
    .case__study__credits__row span:first-child { color: var(--color-gray50); }

    /* ===== NARROW (still a sidebar) ===== */
    /* Porto Rocha runs two breakpoints, not one: at 768px the type and the
       card stack tighten while the layout stays two columns, and only below
       656px does the nav drop above the content. */
    @media (max-width: 768px) {
      .nav__top__middle { row-gap: 24px; padding: 56px 0; }
      .nav__wordmark { font-size: 22px; }

      .nav__cards { row-gap: 6px; }
      .nav__card__inner { min-height: 80px; padding: 12px; column-gap: 9px; }
      .nav__card__img { width: 56px; height: 56px; }
      .nav__card__about .nav__card__inner { height: auto; }

      .nav__light__mode { width: 55px; height: 33px; }
      html.dark .nav__light__mode__knob { transform: translateX(22px); }
      .nav__top__top__right.has-gallery .nav__light__mode { transform: translateX(-37px); }
      .nav__gallery__mode { width: 33px; height: 33px; }
      .nav__gallery__mode__play { border-width: 3.5px 0 3.5px 5.5px; }

      .case__study__text { padding: 56px var(--pd); }
      .case__study__gallery,
      .case__study__sheets { grid-template-columns: 1fr; }
      .case__study__closer__item { flex: 1 1 100%; }
      .case__study__row { grid-template-columns: 1fr; }
    }

    /* ===== STACKED ===== */
    /* The nav leaves the sidebar and sits above the content. Porto Rocha
       drops the container's top gutter to 2px here, since the nav's own 8px
       bottom padding already separates the two. */
    @media (max-width: 656px) {
      .wrapper { flex-flow: column; }

      .nav {
        position: static;
        max-height: none;
        padding-right: var(--pd2);
      }
      .nav__inner { width: auto; }

      .page__container { padding-top: 2px; }
    }

    @property --start2 { syntax: '<color>'; inherits: true; initial-value: #343434; }
    @property --end2 { syntax: '<color>'; inherits: true; initial-value: #1c1c1c; }
  </style>
</head>
<body>

  <audio id="bg-audio" src="/song.mp3" loop></audio>

  <main class="wrapper">

    <div class="nav">
      <div class="nav__inner">

        <header class="nav__top">
          <div class="nav__top__inner">
            <div class="nav__top__top">
              <a class="page__button" id="back-btn" href="/#content">
                <div class="page__button__icon__back"></div>
                <p id="back-label">Back</p>
              </a>
              <div class="nav__top__top__right has-gallery" id="nav-actions">
                <div class="nav__light__mode" id="theme-toggle" role="button" aria-label="Toggle light mode">
                  <div class="nav__light__mode__knob"></div>
                </div>
                <div class="nav__gallery__mode" id="audio-toggle" role="button" aria-label="Play music">
                  <div class="nav__gallery__mode__play"></div>
                </div>
              </div>
            </div>

            <div class="nav__top__middle">
              <a class="nav__wordmark" href="/design"><h1 id="wordmark">Aayush Jain</h1></a>
              <div class="nav__clock display"><p id="clock"></p></div>
            </div>
          </div>
        </header>

        <nav class="nav__cards" id="nav-cards"></nav>

      </div>
    </div>

    <div class="content">
      <div class="page__container" id="page-container">
        <div class="page__card hero" id="hero"></div>
        <div class="case__study__text" id="case-text"></div>
        <div class="page__card case__study__embed" id="case-embed"></div>
        <div class="page__card case__study__flash" id="case-flash"></div>
        <div class="case__study__gallery" id="case-gallery"></div>
        <div class="case__study__sheets" id="case-sheets"></div>
        <div class="page__card case__study__video" id="case-video"></div>
        <div class="case__study__rows" id="case-rows-mid"></div>
        <div class="case__study__closer" id="case-closer"></div>
        <div class="case__study__rows" id="case-rows"></div>
        <div class="case__study__credits" id="case-credits"></div>
      </div>
    </div>

  </main>

  <script type="module">
    import D from './design-content.js';

    document.title = D.siteTitle;
    document.getElementById('wordmark').textContent = D.wordmark;
    document.getElementById('back-label').textContent = D.backLabel;
    document.getElementById('back-btn').href = D.backUrl;

    // ===== Clock =====
    const clockEl = document.getElementById('clock');
    function tickClock() {
      const now = new Date();
      const day = now.toLocaleDateString('en-US', {
        weekday: 'long', month: 'long', day: 'numeric', timeZone: D.timeZone,
      });
      const time = now.toLocaleTimeString('en-GB', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: D.timeZone,
      });
      clockEl.innerHTML = day + '<br>' + D.city + ', ' + time;
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ===== Theme =====
    const root = document.documentElement;
    const savedTheme = localStorage.getItem('designTheme');
    if (savedTheme === 'light') root.classList.replace('dark', 'light');

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const light = root.classList.toggle('light');
      root.classList.toggle('dark', !light);
      localStorage.setItem('designTheme', light ? 'light' : 'dark');
    });

    // ===== Card stack =====
    const cardsEl = document.getElementById('nav-cards');

    // Intro card
    const aboutCard = document.createElement('div');
    aboutCard.className = 'nav__card nav__card__about';
    const aboutInner = document.createElement('div');
    aboutInner.className = 'nav__card__inner';
    const aboutInfo = document.createElement('div');
    aboutInfo.className = 'nav__card__info';
    const aboutH2 = document.createElement('h2');
    aboutH2.textContent = D.about.heading;
    const aboutP = document.createElement('p');
    aboutP.textContent = D.about.text;
    // "Learn more" closes the sentence as a link rather than a separate button
    const aboutLink = document.createElement('a');
    aboutLink.className = 'nav__card__about__link';
    aboutLink.href = D.about.url;
    aboutLink.textContent = D.about.linkLabel;
    aboutP.appendChild(aboutLink);
    aboutP.appendChild(document.createTextNode('.'));
    aboutInfo.append(aboutH2, aboutP);
    aboutInner.appendChild(aboutInfo);

    aboutCard.appendChild(aboutInner);
    cardsEl.appendChild(aboutCard);

    // Project cards — z-index descends so each card stacks under the one above
    const cardEls = D.projects.map((proj, i) => {
      const card = document.createElement('div');
      card.className = 'nav__card';
      card.style.zIndex = String(D.projects.length - i);

      const inner = document.createElement('button');
      inner.type = 'button';
      inner.className = 'nav__card__inner';

      const img = document.createElement('div');
      img.className = 'nav__card__img';
      if (proj.icon) {
        const el = document.createElement('img');
        el.src = proj.icon;
        el.alt = '';
        el.width = 65;
        el.height = 65;
        el.loading = i < 4 ? 'eager' : 'lazy';
        img.appendChild(el);
      } else {
        const bg = document.createElement('div');
        bg.className = 'nav__card__bg';
        bg.textContent = proj.title.charAt(0).toUpperCase();
        img.appendChild(bg);
      }
      inner.appendChild(img);

      const info = document.createElement('div');
      info.className = 'nav__card__info';
      const h2 = document.createElement('h2');
      h2.textContent = proj.title;
      const p = document.createElement('p');
      p.textContent = proj.description;
      info.append(h2, p);
      inner.appendChild(info);

      inner.addEventListener('click', () => select(i, true));

      card.appendChild(inner);
      cardsEl.appendChild(card);
      return card;
    });

    // ===== Card fold =====
    // Porto Rocha's deck, measured off their site rather than guessed. As a
    // card reaches the foot of the nav's visible box it lifts, scales toward
    // half size and fades out, so the stack folds into itself instead of
    // clipping. Every constant falls out of the card pitch: the lift is two
    // cards' worth, the fold starts half a card early, and the fade covers the
    // last 30% of the travel. Reproduces their curve to within 0.005px.
    const navEl = document.querySelector('.nav');
    const FOLD_FADE = 0.3;
    let foldQueued = false;

    function foldCards() {
      foldQueued = false;
      const unit = cardEls[0] && cardEls[0].querySelector('.nav__card__inner');
      if (!unit) return;

      const h = unit.offsetHeight;
      const pitch = h + (parseFloat(getComputedStyle(cardsEl).rowGap) || 0);
      const start = h / 2;
      const lift = pitch * 2;
      const range = lift + start;
      // The nav is its own scroll box on desktop and part of the page once
      // stacked, so fold against whichever edge the reader actually sees.
      const foot = Math.min(navEl.getBoundingClientRect().bottom, window.innerHeight);

      cardsEl.querySelectorAll('.nav__card').forEach(card => {
        const el = card.querySelector('.nav__card__inner');
        if (!el) return;
        // Measure the wrapper, not the inner: the inner carries the transform,
        // so measuring it would feed its own offset back in.
        const gap = foot - card.getBoundingClientRect().bottom;
        const u = Math.min(1, Math.max(0, (start - gap) / range));
        el.style.transform =
          'translateY(' + (-lift * u).toFixed(2) + 'px) scale(' + (1 - 0.5 * u).toFixed(4) + ')';
        el.style.opacity = Math.min(1, Math.max(0, (1 - u) / FOLD_FADE)).toFixed(4);
      });
    }

    function queueFold() {
      if (foldQueued) return;
      foldQueued = true;
      requestAnimationFrame(foldCards);
    }

    navEl.addEventListener('scroll', queueFold, { passive: true });
    window.addEventListener('scroll', queueFold, { passive: true });
    window.addEventListener('resize', queueFold);
    new ResizeObserver(queueFold).observe(cardsEl);
    foldCards();

    // ===== Content panel =====
    const heroEl = document.getElementById('hero');
    const textEl = document.getElementById('case-text');
    const embedEl = document.getElementById('case-embed');
    const galleryEl = document.getElementById('case-gallery');
    const sheetsEl = document.getElementById('case-sheets');
    const rowsEl = document.getElementById('case-rows');
    const midRowsEl = document.getElementById('case-rows-mid');
    const flashEl = document.getElementById('case-flash');
    const videoEl = document.getElementById('case-video');
    const closerEl = document.getElementById('case-closer');
    const creditsEl = document.getElementById('case-credits');

    let current = -1;
    let slides = [];
    let timer = null;
    let flashTimer = null;
    let scrollerObserver = null;
    let videoObserver = null;
    let rowTimers = [];

    // A project with no media yet still gets three placeholder panels so the
    // layout reads the same once real images land in design-content.js.
    function mediaOf(proj) {
      return proj.media.length ? proj.media : [null, null, null];
    }

    function makeMedia(src, label, defer) {
      if (src) {
        const img = document.createElement('img');
        if (!defer) img.src = src;
        img.alt = '';
        return img;
      }
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = label;
      return ph;
    }

    // Card holding a tall image that eases from its top to its bottom and back.
    // The travel distance is measured rather than assumed, so swapping in an
    // image of any height needs no CSS change.
    function makeScroller(src) {
      const card = document.createElement('figure');
      card.className = 'page__card case__study__scroller';
      const img = document.createElement('img');
      img.alt = '';

      const measure = () => {
        const travel = img.offsetHeight - card.clientHeight;
        if (travel > 0) {
          card.style.setProperty('--scroll-to', '-' + travel + 'px');
          card.classList.add('ready');
        } else {
          card.classList.remove('ready');
        }
      };

      img.addEventListener('load', measure);
      if (scrollerObserver) scrollerObserver.disconnect();
      scrollerObserver = new ResizeObserver(measure);
      scrollerObserver.observe(card);

      img.src = src;
      card.appendChild(img);
      return card;
    }

    // A stack can run to dozens of frames, so only the first is fetched up
    // front and the rest fill in on idle — long before the cycle reaches them.
    function loadFrames(imgs, srcs) {
      if (!srcs.length) return;
      imgs[0].src = srcs[0];
      let n = 1;
      const schedule = () => {
        if (n >= srcs.length) return;
        if (window.requestIdleCallback) requestIdleCallback(next);
        else setTimeout(next, 60);
      };
      const next = () => {
        const img = imgs[n];
        img.addEventListener('load', schedule, { once: true });
        img.addEventListener('error', schedule, { once: true });
        img.src = srcs[n++];
      };
      schedule();
    }

    // Hard cuts at Porto Rocha's 700ms, held still while the tab is hidden.
    function cycle(frames) {
      let i = 0;
      return setInterval(() => {
        if (document.hidden) return;
        frames[i].classList.remove('selected');
        i = (i + 1) % frames.length;
        frames[i].classList.add('selected');
      }, 700);
    }

    function renderRows(container, list, proj) {
      container.textContent = '';
      (list || []).forEach(row => {
        const items = Array.isArray(row) ? row : row.items;
        const rowEl = document.createElement('div');
        rowEl.className = 'case__study__row';
        rowEl.style.setProperty('--cols', String(items.length));

        // alignHeights: widths follow each cell's aspect ratio, so every cell
        // in the row resolves to the same height without cropping anything.
        if (row.alignHeights) {
          rowEl.style.gridTemplateColumns = items.map(it => {
            const [w, h] = (it.ratio || row.ratio || '4 / 3').split('/').map(Number);
            return (w / h) + 'fr';
          }).join(' ');
        }

        items.forEach(item => {
          const cell = document.createElement(item.text ? 'div' : 'figure');
          cell.className = 'page__card case__study__row__cell';
          const ratio = item.ratio || row.ratio;
          if (ratio) cell.style.setProperty('--ratio', ratio);

          if (item.text) {
            cell.classList.add('case__study__row__text');
            const h3 = document.createElement('h3');
            h3.textContent = item.heading || proj.title;
            const body = document.createElement('p');
            body.className = 'display';
            body.textContent = item.text;
            cell.append(h3, body);
          } else if (item.flash) {
            const imgs = [];
            const frames = item.flash.map((src, n) => {
              const frame = document.createElement('div');
              frame.className = 'case__study__row__frame' + (n === 0 ? ' selected' : '');
              const img = document.createElement('img');
              img.alt = '';
              imgs.push(img);
              frame.appendChild(img);
              cell.appendChild(frame);
              return frame;
            });
            loadFrames(imgs, item.flash);
            if (frames.length > 1) rowTimers.push(cycle(frames));
          } else {
            const img = document.createElement('img');
            img.src = item.image;
            img.alt = '';
            img.loading = 'lazy';
            cell.appendChild(img);
          }

          rowEl.appendChild(cell);
        });

        container.appendChild(rowEl);
      });
    }

    const panelEl = document.getElementById('page-container');

    // Fade the panel up whenever its contents are swapped, so a new tab eases
    // in rather than snapping straight to the new images.
    function fadeInPanel() {
      panelEl.classList.add('is-entering');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        panelEl.classList.remove('is-entering');
      }));
    }

    function select(i, scroll) {
      if (i === current) return;
      current = i;
      const proj = D.projects[i];
      fadeInPanel();

      cardEls.forEach((c, n) => c.classList.toggle('selected', n === i));
      history.replaceState(null, '', '#' + proj.key);

      // Hero slideshow — a project may set its own ratio when its artwork is
      // shaped very differently from the default (cover would crop it).
      heroEl.style.aspectRatio = proj.heroRatio || '';
      heroEl.textContent = '';
      const media = mediaOf(proj);
      const heroImgs = [];
      slides = media.map((src, n) => {
        const slide = document.createElement('div');
        slide.className = 'hero__slide' + (n === 0 ? ' selected' : '');
        const el = makeMedia(src, proj.title + ' — ' + (n + 1), true);
        if (el.tagName === 'IMG') heroImgs.push(el);
        slide.appendChild(el);
        heroEl.appendChild(slide);
        return slide;
      });
      loadFrames(heroImgs, media.filter(Boolean));

      // Text block
      textEl.textContent = '';
      const h2 = document.createElement('h2');
      h2.textContent = proj.title;
      const body = document.createElement('p');
      body.className = 'case__study__text__text display';
      body.textContent = proj.intro || proj.description;
      textEl.append(h2, body);

      // hideText drops the descriptor entirely, for a project that is only
      // pictures. textAtEnd moves it below the rows instead, for one that
      // wants the pictures to speak first. The container is the same element
      // either way, so nothing else has to know.
      const container = textEl.parentNode;
      textEl.hidden = !!proj.hideText;
      if (proj.textAtEnd) container.insertBefore(textEl, creditsEl);
      else container.insertBefore(textEl, embedEl);

      // Live embed — the published page itself, sitting under the descriptor
      embedEl.textContent = '';
      if (proj.embed) {
        const frame = document.createElement('iframe');
        frame.src = proj.embed;
        frame.title = proj.title;
        frame.loading = 'lazy';
        frame.allow = 'clipboard-write; fullscreen';
        embedEl.appendChild(frame);
      }

      // Gallery — the scroller leads, then the tiles. `gallery` overrides the
      // hero `media` when the two should differ.
      galleryEl.textContent = '';
      if (proj.scroller) galleryEl.appendChild(makeScroller(proj.scroller));
      const tiles = proj.gallery || (proj.scroller ? [] : media);
      tiles.forEach((src, n) => {
        const item = document.createElement('figure');
        item.className = 'page__card case__study__gallery__item';
        item.appendChild(makeMedia(src, proj.title + ' — ' + (n + 1)));
        galleryEl.appendChild(item);
      });

      // Printed pieces — never cropped, so no placeholder stand-in
      sheetsEl.textContent = '';
      (proj.sheets || []).forEach(src => {
        const item = document.createElement('figure');
        item.className = 'page__card case__study__sheets__item';
        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.loading = 'lazy';
        item.appendChild(img);
        sheetsEl.appendChild(item);
      });

      // Flashing card — hard cuts at Porto Rocha's 700ms, paused in a hidden tab
      clearInterval(flashTimer);
      flashEl.textContent = '';
      const flashSrcs = proj.flash || [];
      const flashImgs = [];
      const frames = flashSrcs.map((src, n) => {
        const frame = document.createElement('div');
        frame.className = 'case__study__flash__frame' + (n === 0 ? ' selected' : '');
        const img = document.createElement('img');
        img.alt = '';
        flashImgs.push(img);
        frame.appendChild(img);
        flashEl.appendChild(frame);
        return frame;
      });
      loadFrames(flashImgs, flashSrcs);
      if (frames.length > 1) flashTimer = cycle(frames);

      // Free-form rows — images, flashing stacks and descriptors, any number
      // of cards across. `midRows` sits between the video and the closer,
      // `rows` below the closer.
      rowTimers.forEach(clearInterval);
      rowTimers = [];
      renderRows(midRowsEl, proj.midRows, proj);
      renderRows(rowsEl, proj.rows, proj);

      // Video — silent, looping, and only fetched once it scrolls into view
      if (videoObserver) { videoObserver.disconnect(); videoObserver = null; }
      videoEl.textContent = '';
      if (proj.video) {
        const video = document.createElement('video');
        video.src = proj.video;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = 'metadata';
        videoEl.appendChild(video);
        // Start once it is first seen — so 23MB is not fetched sight unseen —
        // then let it loop constantly rather than pausing when scrolled past.
        videoObserver = new IntersectionObserver((entries, obs) => {
          if (entries.some(e => e.isIntersecting)) {
            video.play().catch(() => {});
            obs.disconnect();
            videoObserver = null;
          }
        }, { threshold: 0.25 });
        videoObserver.observe(videoEl);
      }

      // Closing row — same height for every card, so width tracks aspect ratio
      closerEl.textContent = '';
      (proj.closer ? [].concat(proj.closer) : []).forEach(src => {
        const item = document.createElement('figure');
        item.className = 'page__card case__study__closer__item';
        const img = document.createElement('img');
        img.alt = '';
        const fit = () => {
          if (img.naturalWidth && img.naturalHeight) {
            item.style.flexGrow = img.naturalWidth / img.naturalHeight;
          }
        };
        img.addEventListener('load', fit);
        img.src = src;
        fit(); // already cached
        item.appendChild(img);
        closerEl.appendChild(item);
      });

      // Credits
      creditsEl.textContent = '';
      (proj.credits || []).forEach(row => {
        const line = document.createElement('div');
        line.className = 'case__study__credits__row';
        const role = document.createElement('span');
        role.textContent = row.role;
        const name = document.createElement('span');
        name.textContent = row.name;
        line.append(role, name);
        creditsEl.appendChild(line);
      });

      restart();

      // A newly picked tab starts at the top of its own page, rather than
      // leaving you wherever the previous (often much longer) tab was scrolled.
      if (scroll) {
        if (window.matchMedia('(max-width: 768px)').matches) {
          document.querySelector('.content').scrollIntoView({ behavior: 'smooth' });
        } else {
          window.scrollTo({ top: 0 });
        }
      }
    }

    function restart() {
      clearInterval(timer);
      if (slides.length > 1) timer = cycle(slides);
    }

    // Background music — same track and same localStorage keys as the homepage,
    // so playback carries across pages in either direction.
    const audio = document.getElementById('bg-audio');
    const audioToggle = document.getElementById('audio-toggle');

    function paintAudio() {
      const on = !audio.paused;
      audioToggle.classList.toggle('playing', on);
      audioToggle.setAttribute('aria-label', on ? 'Pause music' : 'Play music');
    }

    if (localStorage.getItem('audioPlaying') === 'true') {
      audio.currentTime = parseFloat(localStorage.getItem('audioTime')) || 0;
      audio.play().then(paintAudio).catch(() => {});
    }

    audioToggle.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        localStorage.setItem('audioPlaying', 'true');
      } else {
        audio.pause();
        localStorage.setItem('audioPlaying', 'false');
      }
      paintAudio();
    });

    audio.addEventListener('play', paintAudio);
    audio.addEventListener('pause', paintAudio);

    setInterval(() => {
      if (!audio.paused) localStorage.setItem('audioTime', audio.currentTime);
    }, 500);

    window.addEventListener('beforeunload', () => {
      localStorage.setItem('audioPlaying', String(!audio.paused));
      localStorage.setItem('audioTime', audio.currentTime);
    });

    paintAudio();

    // Deep-link support: /design#chaiwala opens that project
    const fromHash = D.projects.findIndex(p => '#' + p.key === window.location.hash);
    select(fromHash >= 0 ? fromHash : 0, false);
  </script>

</body>
</html>
